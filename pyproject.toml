[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "l9-ci-debt-intelligence"
version = "0.2.0"
description = "Fleet learning and prevention artifact compiler for the L9 CI constellation"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "duckdb>=1.1,<2",
  "pyarrow>=17,<20",
  "cryptography>=43,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

# Ruff lint/format configuration lives in ruff.toml (single source of truth);
# a [tool.ruff] table here would be silently ignored while ruff.toml exists.

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true

# pyarrow ships no type stubs or py.typed marker.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[project.scripts]
l9-intelligence = "l9_debt_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/l9_debt_intelligence"]
