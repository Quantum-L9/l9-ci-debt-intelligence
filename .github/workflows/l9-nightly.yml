---
# Quantum-L9 org starter — org nightly (ci_deep analyze-semgrep + full-tree tests).
# Thin trigger only. Calls the l9-ci-core nightly kernel; do not add scan logic here.
name: "L9 Nightly"
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  # GitHub refuses a job-level grant that exceeds the workflow-level
  # grant, and it refuses it at load time: the run is created with zero
  # jobs and the conclusion reads startup_failure. The nightly kernel and
  # Core's publish-analysis both need actions:read and checks:write, so
  # those scopes must be granted here, not only on the job.
  actions: read
  checks: write
  contents: read

jobs:
  l9_nightly:
    uses: Quantum-L9/l9-ci-core/.github/workflows/nightly.yml@0d3d8d3cf2828e1a8c01c237597feb3979c2ba52
    permissions:
      actions: read
      checks: write
      contents: read
    secrets: inherit
    with:
      python-version: "3.12"
      run-extended-tests: true
      language: python
